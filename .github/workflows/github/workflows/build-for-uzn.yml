name: Build for UZN
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install deps
        run: npm install esbuild

      - name: Build single cjs
        run: node build-for-uzn.mjs

      - name: Calc MD5
        run: md5sum danmu_api_server.cjs > danmu_api_server.cjs.md5

      - name: Delete old latest release
        uses: dev-drprasad/delete-tag-and-release@v1
        with:
          tag_name: latest
          delete_release: true
          delete_tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: danmu-api服务端(UZN专用构建)
          body: |
每次推送 main 分支后自动构建并覆盖更新，下载链接固定不变。
- 构建提交: ${{ github.sha }}

**使用说明（UZN 网络订阅源）**
1. 复制下方订阅链接
2. 打开弹幕服务页，选择「本地服务」
3. 选择「网络订阅源」
4. 粘贴订阅链接并保存即可

**文件说明**
- `danmu_api_server.cjs`：服务端主程序
- `danmu_api_server.cjs.md5`：主程序md5，订阅源比对md5判断新版本自动更新
          files: |
            danmu_api_server.cjs
            danmu_api_server.cjs.md5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

